schema_version = 1

# `fork_commit == base_commit` means Storyboard carries no separate upstream
# fork repository. Local divergence is the checked, rebuildable patchset named
# by the corresponding import records.

# The Wan2.1 execution surface (DiffSynth runtime, infer/train entries and the
# captioned-video helper) was retired with the Wan2.1 arm. What remains derived
# from MultiShotMaster is the multi-shot dataset adapter.
[[upstreams]]
kind = "fork"
name = "multishotmaster-dataset"
url = "https://github.com/KlingAIResearch/MultiShotMaster.git"
base_commit = "1df812dda262639e4a3ca6e4a1da9000b0a8e124"
fork_commit = "1df812dda262639e4a3ca6e4a1da9000b0a8e124"
license = "Apache-2.0"
license_upstream_path = "LICENSE.txt"
