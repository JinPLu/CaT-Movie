[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "mspc"
version = "0.1.0"
description = "Multi-shot video consistency research and evaluation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8,<1",
    "ftfy>=6.2,<7",
    "imageio[ffmpeg]>=2.34,<3",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "pandas>=2.1,<3",
    "pillow>=10,<13",
    "pydantic>=2.5,<3",
    "pyyaml>=6,<7",
    "regex>=2024.5",
    "safetensors>=0.4,<1",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "tomli>=2,<3; python_version < '3.11'",
    "tqdm>=4.66,<5",
    "transformers>=4.45,<5",
    "scipy>=1.11,<2",
]

[project.scripts]
mspc = "mspc.__main__:main"

[project.optional-dependencies]
api = [
    "cryptography>=43,<50",
    "dashscope>=1.25,<2",
    "openai>=1,<3",
    "requests>=2.31,<3",
]
review = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
gpu-wan = [
    "av==16.1.0",
    "accelerate==1.14.0",
    "dashscope>=1.25,<2",
    "datasets==4.1.1",
    "eva-decord==0.6.1",
    "deepspeed==0.18.6",
    "diffusers==0.38.0",
    "easydict>=1.13,<2",
    "ftfy==6.3.1",
    "numpy>=1.23.5,<2",
    "nvidia-ml-py",
    "peft>=0.17,<1",
    "swanlab>=0.8,<1",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers==4.51.3",
]
gpu-multishotmaster = [
    "accelerate",
    "datasets",
    "eva-decord==0.6.1",
    "deepspeed==0.18.5",
    "huggingface-hub==0.36.0",
    "modelscope==1.33.0",
    "nvidia-ml-py",
    "openai==2.15.0",
    "peft",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "xfuser==0.4.5",
    "yunchang==0.6.4",
]
gpu-vllm-scorer = [
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "transformers==4.57.6",
    "vllm==0.18.0; sys_platform == 'linux'",
]
gpu-renderer-public-metrics = [
    "accelerate>=1,<2",
    "av>=14,<17",
    "datasets>=2,<5",
    "eva-decord>=0.6,<1",
    "huggingface-hub>=0.30,<1",
    "mantis-vl>=0.0.5,<1",
    "sentencepiece>=0.2,<1",
    # ``openai`` is the transport the MSM narrative-coherence column's judge runs
    # over: four of the twelve columns are one judge call per case, and the
    # client raises "CloseAI client requires the 'api' extra (openai)" without
    # it (measured in this env on a real call).  It is a pure-Python HTTP
    # client, so it brings no numerical stack of its own.
    "openai>=1,<3",
    "tensorflow>=2.15,<3; sys_platform == 'linux'",
    # ``setuptools<81`` is for ViCLIP, not for anything of ours: the vendored
    # ``viclip_text.py`` under the scoring resource root does ``from
    # pkg_resources import packaging`` at import time, and setuptools stopped
    # shipping ``pkg_resources`` at 81.  Measured: with the pin removed the
    # resolver took 83.0.0 and the ViCLIP column died with ``No module named
    # 'pkg_resources'`` on an arm that had scored 96/96 minutes earlier.
    "setuptools<81",
    "timm>=1,<2",
    # ``ultralytics`` was YOLO11x's only user and left with it.
    #
    # ``vbench`` is NOT here and cannot be: every published wheel pins
    # ``transformers==4.33.2``, while this project needs >=4.45 and Grounding
    # DINO needs >=4.40, so adding it makes this extra unsatisfiable (measured:
    # ``uv lock`` refuses to resolve).
    #
    # Neither is ``pyiqa``, which carries the same two upstream models VBench
    # itself uses (``laion_aes`` is CLIP ViT-L/14 + the LAION aesthetic linear
    # head, ``musiq-spaq`` is MUSIQ trained on SPAQ) -- every release that
    # would sit in *this* interpreter collides with something else already
    # pinned here. 0.1.10 has no ``transformers`` pin at all, but its
    # dependency ``imgaug`` calls ``np.sctypes``, removed in NumPy 2 (measured:
    # ``import pyiqa`` in this scoring env raised ``AttributeError`` at
    # ``pyiqa/data/transforms.py:7`` -> ``imgaug/imgaug.py:45`` ->
    # ``numpy/__init__.py:778``), and this scoring env needs NumPy 2 (torch
    # 2.10 and TensorFlow 2.21 both require it). 0.1.11-0.1.13 pin
    # ``transformers==4.37.2``; 0.1.16 needs ``transformers>=5.0``. Both
    # collide with this project's ``>=4.45,<5`` -- and this project's own
    # ``[project.dependencies]`` requirement cannot be narrowed per-extra:
    # an extra only ever adds to that requirement, it can never relax it
    # (measured with a marker of the form ``transformers>=4.45,<5;
    # extra != 'gpu-renderer-quality'`` on that base entry: ``uv lock``
    # resolves, but the marker turns out to always evaluate false, so
    # transformers silently drops out of the bare install and every other
    # extra too -- not something to ship).
    #
    # So the two quality columns (aesthetic_quality, imaging_quality) run in
    # their own interpreter instead -- pyiqa 0.1.16, invoked as a subprocess
    # by tools/run/quality_worker.py, the same shape as the renderer_transnet
    # role (TransNetV2 in its own TF-only interpreter), just for a version
    # conflict instead of a torch/TensorFlow process collision. That
    # interpreter is built directly (``uv venv`` + ``uv pip install``, not
    # through this project's own ``pyproject.toml``/``uv sync``) for exactly
    # the same reason renderer_transnet's is: it can never be one of this
    # package's own extras without breaking the base install for everyone
    # else. See the ``renderer_quality`` role in
    # configs/runtime/env_by_arch.json for the exact package list.
]
gpu-renderer-public-metrics-sm120 = [
    "accelerate>=1,<2",
    "av>=14,<17",
    "datasets>=2,<5",
    "eva-decord>=0.6,<1",
    "huggingface-hub>=0.30,<1",
    "mantis-vl>=0.0.5,<1",
    "nvidia-cuda-nvcc-cu12; sys_platform == 'linux'",
    "sentencepiece>=0.2,<1",
    # ``openai`` is the transport the MSM narrative-coherence column's judge runs
    # over: four of the twelve columns are one judge call per case, and the
    # client raises "CloseAI client requires the 'api' extra (openai)" without
    # it (measured in this env on a real call).  It is a pure-Python HTTP
    # client, so it brings no numerical stack of its own.
    "openai>=1,<3",
    "tensorflow==2.21.0; sys_platform == 'linux'",
    # ``setuptools<81`` is for ViCLIP, not for anything of ours: the vendored
    # ``viclip_text.py`` under the scoring resource root does ``from
    # pkg_resources import packaging`` at import time, and setuptools stopped
    # shipping ``pkg_resources`` at 81.  Measured: with the pin removed the
    # resolver took 83.0.0 and the ViCLIP column died with ``No module named
    # 'pkg_resources'`` on an arm that had scored 96/96 minutes earlier.
    "setuptools<81",
    "timm>=1,<2",
    "torch==2.8.0; sys_platform == 'linux'",
    "torchvision==0.23.0; sys_platform == 'linux'",
    "transformers==4.51.3",
    # Same reasoning as the sm80 extra above: neither vbench nor any pyiqa
    # release can sit in this interpreter, and the base project's own
    # transformers pin cannot be relaxed per-extra. The two quality columns
    # run in the standalone renderer_quality interpreter instead.
]
gpu-bernini = [
    "accelerate==0.34.2; python_version >= '3.11'",
    "bernini; python_version >= '3.11'",
    "diffusers==0.35.2; python_version >= '3.11'",
    "flash-attn==2.8.3; python_version >= '3.11' and sys_platform == 'linux'",
    "peft==0.19.1; python_version >= '3.11'",
    "torch==2.5.1; python_version >= '3.11'",
    "torchvision==0.20.1; python_version >= '3.11'",
    "transformers==4.57.3; python_version >= '3.11'",
    "veomni; python_version >= '3.11'",
]
gpu-bernini-sm120 = [
    "accelerate==0.34.2; python_version >= '3.11'",
    "bernini; python_version >= '3.11'",
    "diffusers==0.35.2; python_version >= '3.11'",
    "flash-attn==2.8.3; python_version >= '3.11' and sys_platform == 'linux'",
    "peft==0.19.1; python_version >= '3.11'",
    "torch==2.7.1; python_version >= '3.11'",
    "torchvision==0.22.1; python_version >= '3.11'",
    "transformers==4.57.3; python_version >= '3.11'",
    "veomni; python_version >= '3.11'",
]
gpu-bernini-sm120-flex28 = [
    "accelerate==0.34.2; python_version >= '3.11'",
    "bernini; python_version >= '3.11'",
    "diffusers==0.35.2; python_version >= '3.11'",
    "flash-attn==2.8.3; python_version >= '3.11' and sys_platform == 'linux'",
    "peft==0.19.1; python_version >= '3.11'",
    "torch==2.8.0; python_version >= '3.11'",
    "torchvision==0.23.0; python_version >= '3.11'",
    "transformers==4.57.3; python_version >= '3.11'",
    "veomni; python_version >= '3.11'",
]
gpu-bernini-sm80-sm120-flex28 = [
    "accelerate==0.34.2; python_version >= '3.11'",
    "bernini; python_version >= '3.11'",
    "diffusers==0.35.2; python_version >= '3.11'",
    "flash-attn==2.8.3; python_version >= '3.11' and sys_platform == 'linux'",
    "peft==0.19.1; python_version >= '3.11'",
    "torch==2.8.0; python_version >= '3.11'",
    "torchvision==0.23.0; python_version >= '3.11'",
    "transformers==4.57.3; python_version >= '3.11'",
    "veomni; python_version >= '3.11'",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
]

[tool.uv]
default-groups = ["dev"]
no-build-isolation-package = ["deepspeed"]

conflicts = [
    [
        { extra = "gpu-wan" },
        { extra = "gpu-multishotmaster" },
        { extra = "gpu-vllm-scorer" },
        { extra = "gpu-renderer-public-metrics" },
        { extra = "gpu-renderer-public-metrics-sm120" },
        { extra = "gpu-bernini" },
        { extra = "gpu-bernini-sm120" },
        { extra = "gpu-bernini-sm120-flex28" },
        { extra = "gpu-bernini-sm80-sm120-flex28" },
    ],
]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_FORCE_BUILD = "TRUE", FLASH_ATTN_CUDA_ARCHS = "80;120", NVCC_THREADS = "4" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "gpu-wan", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-multishotmaster", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-vllm-scorer", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu124", extra = "gpu-bernini", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-bernini-sm120", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-bernini-sm120-flex28", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-bernini-sm80-sm120-flex28", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-renderer-public-metrics-sm120", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", extra = "gpu-wan", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-multishotmaster", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-vllm-scorer", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu124", extra = "gpu-bernini", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-bernini-sm120", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-bernini-sm120-flex28", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-bernini-sm80-sm120-flex28", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "gpu-renderer-public-metrics-sm120", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", extra = "gpu-vllm-scorer", marker = "sys_platform == 'linux'" },
]
bernini = { git = "https://github.com/bytedance/Bernini.git", rev = "82d573e9a553dccb1405dde4cb0f26466f9df6c5" }
veomni = { git = "https://github.com/ByteDance-Seed/VeOmni.git", rev = "6ab293ecdfdd90ef3941fc81065d9f947b5b4e4f" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mspc*"]

[tool.setuptools.package-data]
"mspc.comparison_methods" = ["review.html", "README.md", "deployment.json", "configs/*.json", "environments/ic_lora/*"]
"mspc.evaluation" = ["annotations/*", "core/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = ["archive", ".git", "__pycache__", ".pytest_cache", ".codegraph", "outputs", "node_modules"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "gpu: requires a CUDA runtime",
    "integration: requires an external service or heavyweight runtime",
]
