[project]
name = "storyboard-planner-infra"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==5.9.0",
  "peft==0.19.1",
  "accelerate==1.12.0",
  "ms-swift==4.6.0",
  "flash-linear-attention==0.5.2",
  "causal-conv1d==1.7.0",
  "flash-attn==2.8.3.post2",
  "liger-kernel==0.8.4",
  "qwen-vl-utils==0.0.14",
  "decord==0.6.0",
  "swanlab==0.10.2",
  "pydantic==2.12.5",
  "pytest==8.4.2",
  "pytest-asyncio==1.3.0",
  "pandas==2.3.3",
  "einops==0.8.2",
  "ftfy==6.3.1",
  "imageio[ffmpeg]==2.37.3",
  "opencv-python-headless==4.13.0.92",
  "scipy==1.17.1",
  "setuptools==84.0.0",
  "ninja==1.13.0",
  "psutil==7.2.2",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cu128"}
torchvision = {index = "pytorch-cu128"}

[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.10.0", "packaging", "ninja", "setuptools"]
causal-conv1d = ["torch==2.10.0", "packaging", "ninja", "setuptools"]
