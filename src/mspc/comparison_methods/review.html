<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storyboard · 同故事视频验收</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f4;--fg:#202725;--muted:#656f6b;--line:#d6dcd8;--panel:white;--accent:#216451}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:25px;margin:0}p{margin:6px 0}button,select,input,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 10px}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:white}button:disabled{opacity:.45;cursor:default}.muted{color:var(--muted);font-size:13px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:17px 0}.controls select#story{flex:1;min-width:280px}.toolbar{position:sticky;top:0;background:var(--bg);z-index:2;padding:10px 0;border-bottom:1px solid var(--line)}#seek{flex:1;min-width:160px;padding:0}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}article{border:1px solid var(--line);background:var(--panel);padding:13px;min-width:0}article h3{font-size:17px;margin:0 0 9px}video{width:100%;aspect-ratio:26/15;background:#121614;display:block}article .note{font-size:13px;color:var(--muted);min-height:2em;margin:8px 0}.unavailable{height:200px;display:grid;align-content:center;justify-content:center;text-align:center;background:var(--bg);padding:20px}.error{color:#b34735}.review-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}textarea{width:100%;height:58px;margin-top:8px;font-size:13px}.saved{font-size:13px;color:var(--accent)}details{margin-top:10px}summary{cursor:pointer}pre{max-height:340px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:12px;font:12px/1.5 monospace}#request{white-space:pre-wrap;max-height:260px;overflow:auto}#notice{border-left:3px solid var(--accent);padding:5px 13px;margin:12px 0}.method-choice{font-size:13px;display:inline-flex;gap:5px;margin-right:12px}.status{font-size:12px;font-weight:400;color:var(--muted)}@media(max-width:780px){main{padding:14px}#grid{gap:10px}article{padding:9px}article h3{font-size:15px}header{align-items:flex-start}h1{font-size:21px}}@media(max-width:420px){#grid{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#181d1b;--fg:#e5ebe7;--muted:#a0afa7;--line:#39463e;--panel:#212a25;--accent:#438e72}.error{color:#ec9c82}}
</style><main><header><div><div class="muted">Storyboard / 生成原片 / 人工验收</div><h1>同一个故事，逐方法对照</h1></div><button id="refresh">刷新产物</button></header><p class="muted">同步原速播放；时长不同的原片各自结束，不裁短、不拉伸。你的意见单独保存，不改变生成记录。</p>
<div class="controls"><select id="scope"><option value="test">正式测试 92 故事</option><option value="dev">开发样例（旧配置）</option></select><input id="filter" aria-label="搜索故事" placeholder="搜索故事或请求"><select id="story" aria-label="选择故事"></select></div>
<div id="notice"></div><details><summary>共同请求与验收内容</summary><p id="request"></p><p class="muted">关注：人物与场景是否可辨、动作是否完成、末态是否出现、跨镜是否保持；工程正常和语义完成可分别记在意见里。</p></details>
<div id="method-filter" class="controls"></div><div class="toolbar controls"><button class="primary" id="play">同步播放</button><button id="pause">全部暂停</button><button id="restart">回到开头</button><select id="speed" aria-label="播放速度"><option value="1">原速 1×</option><option value="0.5">慢放 0.5×</option><option value="2">快放 2×</option></select><input id="seek" aria-label="共同播放位置" type="range" min="0" max="1" step="0.0625" value="0"><span id="clock">0.00 s</span></div><div id="grid"></div><p class="muted" id="updated"></p></main>
<script>
let data,active,selected=new Set(),videos=[];const $=s=>document.querySelector(s);const labels={completed:'已生成 · 待人工验收',generation_failed:'生成失败',generation_started:'生成中',missing:'未生成'};const decisions={accepted:'通过',rejected:'不通过',needs_review:'待核查'};
function text(el,s){el.textContent=s??'';return el}function node(tag,s,cls){const e=document.createElement(tag);if(s!=null)e.textContent=s;if(cls)e.className=cls;return e}
function pause(){videos.forEach(v=>v.pause())}function seek(t){videos.forEach(v=>{if(Number.isFinite(v.duration))v.currentTime=Math.min(t,v.duration)});$('#clock').textContent=t.toFixed(2)+' s'}
async function load(){pause();const current=active?.story_id||new URLSearchParams(location.search).get('story');const r=await fetch('/api/catalog');if(!r.ok)throw Error('产物清单读取失败');data=await r.json();$('#updated').textContent='产物读取：'+new Date(data.updated_at).toLocaleString()+' · 点击“刷新产物”接入新完成的视频';selectStories(current)}
function selectStories(id){const q=$('#filter').value.toLowerCase(),scope=$('#scope').value;const rows=data.stories.filter(s=>s.split===scope&&(s.story_id+' '+s.request).toLowerCase().includes(q));const sel=$('#story');sel.replaceChildren();for(const s of rows){const count=s.methods.filter(m=>m.status==='completed').length;const o=node('option',s.story_id+' · '+count+' 部完整视频');o.value=s.story_id;sel.append(o)}if(rows.some(s=>s.story_id===id))sel.value=id;render()}
function render(){pause();const sid=$('#story').value;active=data.stories.find(s=>s.story_id===sid);$('#grid').replaceChildren();$('#method-filter').replaceChildren();videos=[];if(!active){$('#notice').textContent='没有匹配的故事，请调整搜索。';return}text($('#request'),active.request);text($('#notice'),active.split==='test'?'正式测试：保留全部 92 故事及失败、未生成项。'+active.story_id:'开发单例：SD 旧 Euler、IC 旧拆分 caption；仅核看既有结果，不作为修正版验收。');
const methods=data.methods;for(const m of methods){selected.add(m.id);const l=node('label',null,'method-choice'),c=node('input');c.type='checkbox';c.checked=true;c.onchange=()=>{c.checked?selected.add(m.id):selected.delete(m.id);draw(methods)};l.append(c,document.createTextNode(m.label));$('#method-filter').append(l)}draw(methods)}
function draw(methods){pause();videos=[];$('#grid').replaceChildren();$('#seek').value=0;$('#clock').textContent='0.00 s';for(const method of methods){if(!selected.has(method.id))continue;const m=active.methods.find(m=>m.method===method.id),card=node('article');card.append(node('h3',method.label));const status=node('div',m?(labels[m.status]||m.status):'未生成','status');card.append(status);if(m?.asset){const v=node('video');v.controls=true;v.muted=true;v.playsInline=true;v.preload='metadata';v.src='/media?key='+encodeURIComponent(m.asset);v.dataset.method=method.id;v.onloadedmetadata=()=>{$('#seek').max=Math.max(...videos.map(x=>Number.isFinite(x.duration)?x.duration:0));status.textContent=(m.partial?'失败后保留的部分片':(labels[m.status]||m.status))+' · '+v.duration.toFixed(2)+'秒'};v.onerror=()=>status.textContent='视频加载失败，请刷新或检查连接';card.append(v);videos.push(v)}else card.append(node('div',m?.error||'尚无这条方法的完整视频','unavailable'));
card.append(node('p',m?.note||'保留在完整分母内。','note'));if(m?.error)card.append(node('p',m.error,'error'));if(m){const key=active.story_id+'/'+method.id,previous=data.decisions[key],note=node('textarea');note.placeholder='验收意见，例如：第 3 镜人物变化；最后动作未完成';note.value=previous?.note||'';const saved=node('div',previous?'已保存：'+decisions[previous.decision]:'尚未提交人工验收','saved'),buttons=node('div',null,'review-row');for(const [value,label] of Object.entries(decisions)){const b=node('button',label);b.onclick=async()=>{try{b.disabled=true;const r=await fetch('/api/decisions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({story_id:active.story_id,method:method.id,decision:value,note:note.value})});const result=await r.json();if(!r.ok)throw Error(result.error);data.decisions[key]=result;saved.textContent='已保存：'+label+' · '+new Date(result.saved_at).toLocaleTimeString()}catch(e){saved.textContent='未保存：'+e.message}finally{b.disabled=false}};buttons.append(b)}card.append(note,buttons,saved);const det=node('details'),summary=node('summary','实际输入、配置与原始记录'),pre=node('pre','展开后读取');det.append(summary,pre);det.ontoggle=async()=>{if(det.open&&!det.dataset.loaded){const r=await fetch('/api/detail?key='+encodeURIComponent(key));pre.textContent=JSON.stringify(await r.json(),null,2);det.dataset.loaded='1'}};card.append(det)}$('#grid').append(card)}}
$('#story').onchange=render;$('#scope').onchange=()=>selectStories();$('#filter').oninput=()=>selectStories();$('#refresh').onclick=()=>load().catch(e=>$('#notice').textContent=e.message);$('#pause').onclick=pause;$('#restart').onclick=()=>{pause();seek(0)};$('#seek').oninput=e=>seek(+e.target.value);$('#speed').onchange=()=>videos.forEach(v=>v.playbackRate=+$('#speed').value);$('#play').onclick=()=>{const t=+$('#seek').value;seek(t);videos.forEach(v=>{v.playbackRate=+$('#speed').value;if(t<v.duration)v.play().catch(()=>{})})};setInterval(()=>{const v=videos.find(v=>!v.paused&&!v.ended);if(v){$('#seek').value=v.currentTime;$('#clock').textContent=v.currentTime.toFixed(2)+' s'}},100);$('#scope').value=new URLSearchParams(location.search).get('scope')==='dev'?'dev':'test';load().catch(e=>$('#notice').textContent='连接未就绪：'+e.message);
</script></html>
