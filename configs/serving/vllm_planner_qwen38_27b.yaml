# 论文规划器行出计划所用的 Qwen3.8-27B 服务：纯文本、单卡、上下文 49,152、64 路、前缀缓存、xgrammar 结构约束；
# 思考档由客户端在请求里开到 medium（tools/run/planner_form_plans.py --sampling thinking-medium）。
vllm_executable: ${MSPC_SHARED_ROOT}/env/planner_inference_h20_cu128/bin/vllm
model_path: ${MSPC_SHARED_ROOT}/OoVMetric/models_ckpt/Qwen3.8-27B
host: "127.0.0.1"
port: 8191
tensor_parallel_size: 1
max_model_len: 49152
gpu_memory_utilization: 0.92
dtype: bfloat16
trust_remote_code: true
extra_cli_args:
  - "--served-model-name"
  - "Qwen3.8-27B"
  - "--max-num-seqs"
  - "64"
  - "--chat-template-content-format"
  - "openai"
  - "--default-chat-template-kwargs"
  - '{"enable_thinking":false}'
  - "--reasoning-parser"
  - "qwen3"
  - "--language-model-only"
  - "--enable-prefix-caching"
  - "--structured-outputs-config.backend"
  - "xgrammar"
ld_library_path: ""
omp_num_threads: 4
